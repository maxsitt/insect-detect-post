[project]
name = "insect-detect-post"
version = "1.1.0"
description = "Software for post-processing of data captured with the Insect Detect camera trap."
requires-python = ">=3.13,<3.15"
license = "AGPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
readme = "README.md"
authors = [{name = "Maximilian Sittinger"}]
dependencies = [
    "numpy >=2.5.4,<3",
    "opencv-python-headless >=5.0.0.93,<6",
    "polars >=2.0.0,<3",
    "psutil >=7.2.2,<8",
    "pybioclip >=2.1.6,<3",
    "pydantic >=2.14.1,<3",
    "pygbif >=0.7.0,<0.8",
    "pyside6-addons >=6.12.0,<7",
    "pyside6-essentials >=6.12.0,<7",
    "pyyaml >=6.0.3,<7",
    "qt-logging >=1.0.1,<2",
    "qt-parameters >=1.5.1,<2",
    "qt-themes >=0.4.1,<1",
    "ultralytics-opencv-headless >=8.4.183,<9",
]

[project.optional-dependencies]
cpu = [
    "onnx >=1.23.2,<2",
    "onnxruntime >=1.31.0,<2",
    "torch >=2.14.1,<3",
    "torchvision >=0.29.1,<1",
]
cuda126 = [
    "onnx >=1.23.2,<2",
    "onnxruntime-gpu >=1.26.0,<1.27.0",
    "torch >=2.14.1,<3",
    "torchvision >=0.29.1,<1",
]
cuda132 = [
    "onnx >=1.23.2,<2",
    "onnxruntime-gpu >=1.31.0,<2",
    "torch >=2.14.1,<3",
    "torchvision >=0.29.1,<1",
]

[project.scripts]
gui = "insectdetect_post.post_processing_gui:main"
validate = "insectdetect_post.validation_gui:main"
update = "insectdetect_post.update:main"

[project.urls]
Documentation = "https://maxsitt.github.io/insect-detect-docs/"
Repository = "https://github.com/maxsitt/insect-detect-post"
Issues = "https://github.com/maxsitt/insect-detect-post/issues"

[tool.uv]
package = true
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda126" },
        { extra = "cuda132" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda126" },
    { index = "pytorch-cu132", extra = "cuda132" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda126" },
    { index = "pytorch-cu132", extra = "cuda132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["E501"]
